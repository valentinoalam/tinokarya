<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CV/Resume Generator</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .form-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow-y: auto;
            max-height: 100%;
        }

        .preview-panel {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .form-header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .form-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .form-section h3 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .add-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .add-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .remove-button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }

        .dynamic-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 3px solid #3498db;
            position: relative;
        }

        .export-buttons {
            position: sticky;
            top: 0;
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .export-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .export-pdf {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .export-html {
            background: linear-gradient(135deg, #27ae60, #219a52);
            color: white;
        }

        .export-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .preview-content {
            height: calc(100% - 80px);
            overflow-y: auto;
            padding: 20px;
        }

        /* CV Styles */
        .cv-container {
            background: white;
            min-height: 100%;
        }

        .cv-header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .cv-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.2);
            margin: 0 auto 20px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: #999;
            position: relative;
            z-index: 1;
        }

        .cv-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .cv-header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.9);
            font-size: 14px;
        }

        .cv-section {
            padding: 30px;
        }

        .cv-section-title {
            font-size: 1.8em;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
        }

        .cv-section-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .summary-box {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .summary-box::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            opacity: 0.1;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .skill-category {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-left: 4px solid;
            transition: all 0.3s ease;
        }

        .skill-category:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
        }

        .frontend { border-left-color: #e74c3c; }
        .backend { border-left-color: #3498db; }
        .database { border-left-color: #f39c12; }
        .tools { border-left-color: #27ae60; }

        .skill-category h4 {
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .skill-list {
            list-style: none;
        }

        .skill-list li {
            padding: 8px 0;
            border-bottom: 1px solid #f1f2f6;
            color: #666;
        }

        .experience-item, .education-item, .project-item {
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(248, 249, 250, 0.8);
            border-radius: 12px;
            border-left: 3px solid #667eea;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .item-title {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.1em;
        }

        .item-subtitle {
            color: #666;
            margin-bottom: 5px;
        }

        .item-date {
            color: #888;
            font-size: 0.9em;
            font-weight: 500;
        }

        .item-description {
            color: #555;
            line-height: 1.6;
            margin-top: 10px;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .tech-tag {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .certificate-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .certificate-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
        }

        .certificate-img {
            width: 100%;
            height: 100px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #999;
        }

        .certificate-content {
            padding: 15px;
        }

        .certificate-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .certificate-issuer {
            color: #666;
            font-size: 0.8em;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .preview-panel {
                min-height: 800px;
            }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .contact-info {
                gap: 15px;
            }
            
            .skills-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Form Panel -->
        <div class="form-panel">
            <div class="form-header">
                <h1><i class="fas fa-user-edit"></i> CV Builder</h1>
                <p>Create your professional resume with ease</p>
            </div>

            <form id="cvForm">
                <!-- Personal Information -->
                <div class="form-section">
                    <h3><i class="fas fa-user"></i> Personal Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fullName">Full Name *</label>
                            <input type="text" id="fullName" required>
                        </div>
                        <div class="form-group">
                            <label for="jobTitle">Job Title *</label>
                            <input type="text" id="jobTitle" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="linkedin">LinkedIn URL</label>
                            <input type="url" id="linkedin">
                        </div>
                        <div class="form-group">
                            <label for="github">GitHub URL</label>
                            <input type="url" id="github">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="portfolio">Portfolio URL</label>
                            <input type="url" id="portfolio">
                        </div>
                        <div class="form-group">
                            <label for="location">Location</label>
                            <input type="text" id="location">
                        </div>
                    </div>
                </div>

                <!-- Summary -->
                <div class="form-section">
                    <h3><i class="fas fa-quote-left"></i> Career Objective / Summary</h3>
                    <div class="form-group full-width">
                        <label for="summary">Professional Summary</label>
                        <textarea id="summary" rows="5" placeholder="Write a compelling summary of your professional background and career goals..."></textarea>
                    </div>
                </div>

                <!-- Experience -->
                <div class="form-section">
                    <h3><i class="fas fa-briefcase"></i> Professional Experience</h3>
                    <div id="experienceContainer">
                        <!-- Experience items will be added here -->
                    </div>
                    <button type="button" class="add-button" onclick="addExperience()">
                        <i class="fas fa-plus"></i> Add Experience
                    </button>
                </div>

                <!-- Education -->
                <div class="form-section">
                    <h3><i class="fas fa-graduation-cap"></i> Education</h3>
                    <div id="educationContainer">
                        <!-- Education items will be added here -->
                    </div>
                    <button type="button" class="add-button" onclick="addEducation()">
                        <i class="fas fa-plus"></i> Add Education
                    </button>
                </div>

                <!-- Skills -->
                <div class="form-section">
                    <h3><i class="fas fa-code"></i> Technical Skills</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="frontendSkills">Frontend Skills</label>
                            <textarea id="frontendSkills" rows="3" placeholder="React, JavaScript, HTML, CSS, etc."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="backendSkills">Backend Skills</label>
                            <textarea id="backendSkills" rows="3" placeholder="Node.js, Python, Java, etc."></textarea>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="databaseSkills">Database Skills</label>
                            <textarea id="databaseSkills" rows="3" placeholder="PostgreSQL, MongoDB, MySQL, etc."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="toolsSkills">Tools & Platforms</label>
                            <textarea id="toolsSkills" rows="3" placeholder="Docker, AWS, Git, etc."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Projects -->
                <div class="form-section">
                    <h3><i class="fas fa-project-diagram"></i> Projects</h3>
                    <div id="projectsContainer">
                        <!-- Project items will be added here -->
                    </div>
                    <button type="button" class="add-button" onclick="addProject()">
                        <i class="fas fa-plus"></i> Add Project
                    </button>
                </div>

                <!-- Certifications -->
                <div class="form-section">
                    <h3><i class="fas fa-certificate"></i> Certifications</h3>
                    <div id="certificationsContainer">
                        <!-- Certification items will be added here -->
                    </div>
                    <button type="button" class="add-button" onclick="addCertification()">
                        <i class="fas fa-plus"></i> Add Certification
                    </button>
                </div>
            </form>
        </div>

        <!-- Preview Panel -->
        <div class="preview-panel">
            <div class="export-buttons">
                <button class="export-button export-pdf" onclick="exportToPDF()">
                    <i class="fas fa-file-pdf"></i> Export PDF
                </button>
                <button class="export-button export-html" onclick="exportToHTML()">
                    <i class="fas fa-code"></i> Export HTML
                </button>
            </div>
            <div class="preview-content">
                <div id="cvPreview" class="cv-container">
                    <!-- CV preview will be generated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let experienceCount = 0;
        let educationCount = 0;
        let projectCount = 0;
        let certificationCount = 0;

        // Initialize the form with sample data
        document.addEventListener('DOMContentLoaded', function() {
            loadSampleData();
            addExperience();
            addEducation();
            addProject();
            addCertification();
            updatePreview();
            
            // Add event listeners to all form elements
            const formElements = document.querySelectorAll('#cvForm input, #cvForm textarea, #cvForm select');
            formElements.forEach(element => {
                element.addEventListener('input', updatePreview);
            });
        });

        function loadSampleData() {
            document.getElementById('fullName').value = 'Rachit Sharma';
            document.getElementById('jobTitle').value = 'Fullstack Developer';
            document.getElementById('email').value = 'rachit.sharma@email.com';
            document.getElementById('phone').value = '+62 812-3456-7890';
            document.getElementById('linkedin').value = 'https://linkedin.com/in/rachit-sharma-0b9b44117';
            document.getElementById('github').value = 'https://github.com/rachitsharma';
            document.getElementById('portfolio').value = 'https://rachitsharma.dev';
            document.getElementById('location').value = 'Melbourne, Australia';
            document.getElementById('summary').value = 'Ambitious software developer with a strong foundation in Java, .NET, JavaScript, SQL, and C# and experience in full-stack development and backend integration. Seeking a challenging role in a dynamic team to apply technical skills and contribute to impactful projects, with a vision to grow as a technology expert and problem solver.';
            
            document.getElementById('frontendSkills').value = 'React, JavaScript, HTML, CSS, Bootstrap, TypeScript, Next.js';
            document.getElementById('backendSkills').value = 'Node.js, Java, C#, .NET Core, RESTful APIs, Express.js';
            document.getElementById('databaseSkills').value = 'PostgreSQL, MongoDB, MySQL, SQL Server';
            document.getElementById('toolsSkills').value = 'Docker, AWS, Git, GitHub, Jira, Agile Methodologies';
        }

        function addExperience() {
            experienceCount++;
            const container = document.getElementById('experienceContainer');
            const div = document.createElement('div');
            div.className = 'dynamic-item';
            div.innerHTML = `
                <div class="form-row">
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" name="expTitle${experienceCount}" onchange="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Company</label>
                        <input type="text" name="expCompany${experienceCount}" onchange="updatePreview()">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" name="expLocation${experienceCount}" onchange="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Duration</label>
                        <input type="text" name="expDuration${experienceCount}" placeholder="Jan 2020 - Dec 2022" onchange="updatePreview()">
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Job Description</label>
                    <textarea name="expDescription${experienceCount}" rows="4" onchange="updatePreview()"></textarea>
                </div>
                <button type="button" class="remove-button" onclick="this.parentElement.remove(); updatePreview();">Remove</button>
            `;
            container.appendChild(div);
        }

        function addEducation() {
            educationCount++;
            const container = document.getElementById('educationContainer');
            const div = document.createElement('div');
            div.className = 'dynamic-item';
            div.innerHTML = `
                <div class="form-row">
                    <div class="form-group">
                        <label>Degree</label>
                        <input type="text" name="eduDegree${educationCount}" onchange="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Institution</label>
                        <input type="text" name="eduInstitution${educationCount}" onchange="updatePreview()">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" name="eduLocation${educationCount}" onchange="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Duration</label>
                        <input type="text" name="eduDuration${educationCount}" placeholder="Mar 2015 - Nov 2019" onchange="updatePreview()">
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Description/Achievements</label>
                    <textarea name="eduDescription${educationCount}" rows="3" onchange="updatePreview()"></textarea>
                </div>
                <button type="button" class="remove-button" onclick="this.parentElement.remove(); updatePreview();">Remove</button>
            `;
            container.appendChild(div);
        }

        function addProject() {
            projectCount++;
            const container = document.getElementById('projectsContainer');
            const div = document.createElement('div');
            div.className = 'dynamic-item';
            div.innerHTML = `
                <div class="form-row">
                    <div class="form-group">
                        <label>Project Name</label>
                        <input type="text" name="projName${projectCount}" onchange="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Project URL (optional)</label>
                        <input type="url" name="projUrl${projectCount}" onchange="updatePreview()">
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Description</label>
                    <textarea name="projDescription${projectCount}" rows="3" onchange="updatePreview()"></textarea>
                </div>
                <div class="form-group full-width">
                    <label>Technologies Used</label>
                    <input type="text" name="projTech${projectCount}" placeholder="React, Node.js, MongoDB, etc." onchange="updatePreview()">
                </div>
                <button type="button" class="remove-button" onclick="this.parentElement.remove(); updatePreview();">Remove</button>
            `;
            container.appendChild(div);
        }

        function addCertification() {
            certificationCount++;
            const container = document.getElementById('certificationsContainer');
            const div = document.createElement('div');
            div.className = 'dynamic-item';
            div.innerHTML = `
                <div class="form-row">
                    <div class="form-group">
                        <label>Certification Name</label>
                        <input type="text" name="certName${certificationCount}" onchange="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Issuer</label>
                        <input type="text" name="certIssuer${certificationCount}" onchange="updatePreview()">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="text" name="certDate${certificationCount}" placeholder="2024" onchange="updatePreview()">
                    </div>
                    <div class="form-group">
                        <label>Credential URL (optional)</label>
                        <input type="url" name="certUrl${certificationCount}" onchange="updatePreview()">
                    </div>
                </div>
                <button type="button" class="remove-button" onclick="this.parentElement.remove(); updatePreview();">Remove</button>
            `;
            container.appendChild(div);
        }

        function updatePreview() {
            const formData = new FormData(document.getElementById('cvForm'));
            const data = {};
            
            // Get basic form data
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }
            
            // Get data from individual inputs
            data.fullName = document.getElementById('fullName').value;
            data.jobTitle = document.getElementById('jobTitle').value;
            data.email = document.getElementById('email').value;
            data.phone = document.getElementById('phone').value;
            data.linkedin = document.getElementById('linkedin').value;
            data.github = document.getElementById('github').value;
            data.portfolio = document.getElementById('portfolio').value;
            data.location = document.getElementById('location').value;
            data.summary = document.getElementById('summary').value;
            
            data.frontendSkills = document.getElementById('frontendSkills').value;
            data.backendSkills = document.getElementById('backendSkills').value;
            data.databaseSkills = document.getElementById('databaseSkills').value;
            data.toolsSkills = document.getElementById('toolsSkills').value;
            
            generatePreview(data);
        }

        function generatePreview(data) {
            const preview = document.getElementById('cvPreview');
            
            const html = `
                <div class="cv-header">
                    <div class="profile-img">
                        <i class="fas fa-user"></i>
                    </div>
                    <h1>${data.fullName || 'Your Name'}</h1>
                    <p class="subtitle">${data.jobTitle || 'Your Title'}</p>
                    <div class="contact-info">
                        ${data.email ? `<div class="contact-item"><i class="fas fa-envelope"></i> ${data.email}</div>` : ''}
                        ${data.phone ? `<div class="contact-item"><i class="fas fa-phone"></i> ${data.phone}</div>` : ''}
                        ${data.linkedin ? `<div class="contact-item"><i class="fab fa-linkedin"></i> LinkedIn</div>` : ''}
                        ${data.github ? `<div class="contact-item"><i class="fab fa-github"></i> GitHub</div>` : ''}
                        ${data.portfolio ? `<div class="contact-item"><i class="fas fa-globe"></i> Portfolio</div>` : ''}
                        ${data.location ? `<div class="contact-item"><i class="fas fa-map-marker-alt"></i> ${data.location}</div>` : ''}
                    </div>
                </div>

                ${data.summary ? `
                <div class="cv-section">
                    <h2 class="cv-section-title">Career Objective</h2>
                    <div class="summary-box">
                        <p>${data.summary}</p>
                    </div>
                </div>
                ` : ''}

                ${generateSkillsSection(data)}
                ${generateExperienceSection(data)}
                ${generateEducationSection(data)}
                ${generateProjectsSection(data)}
                ${generateCertificationsSection(data)}
            `;
            
            preview.innerHTML = html;
        }

        function generateSkillsSection(data) {
            if (!data.frontendSkills && !data.backendSkills && !data.databaseSkills && !data.toolsSkills) {
                return '';
            }

            return `
                <div class="cv-section">
                    <h2 class="cv-section-title">Technical Skills</h2>
                    <div class="skills-grid">
                        ${data.frontendSkills ? `
                        <div class="skill-category frontend">
                            <h4><i class="fas fa-paint-brush"></i> Frontend</h4>
                            <ul class="skill-list">
                                ${data.frontendSkills.split(',').map(skill => `<li>${skill.trim()}</li>`).join('')}
                            </ul>
                        </div>
                        ` : ''}
                        
                        ${data.backendSkills ? `
                        <div class="skill-category backend">
                            <h4><i class="fas fa-server"></i> Backend</h4>
                            <ul class="skill-list">
                                ${data.backendSkills.split(',').map(skill => `<li>${skill.trim()}</li>`).join('')}
                            </ul>
                        </div>
                        ` : ''}
                        
                        ${data.databaseSkills ? `
                        <div class="skill-category database">
                            <h4><i class="fas fa-database"></i> Database</h4>
                            <ul class="skill-list">
                                ${data.databaseSkills.split(',').map(skill => `<li>${skill.trim()}</li>`).join('')}
                            </ul>
                        </div>
                        ` : ''}
                        
                        ${data.toolsSkills ? `
                        <div class="skill-category tools">
                            <h4><i class="fas fa-tools"></i> Tools & Platforms</h4>
                            <ul class="skill-list">
                                ${data.toolsSkills.split(',').map(skill => `<li>${skill.trim()}</li>`).join('')}
                            </ul>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function generateExperienceSection(data) {
            const experiences = [];
            for (let i = 1; i <= experienceCount; i++) {
                const title = data[`expTitle${i}`];
                const company = data[`expCompany${i}`];
                const location = data[`expLocation${i}`];
                const duration = data[`expDuration${i}`];
                const description = data[`expDescription${i}`];
                
                if (title || company) {
                    experiences.push({title, company, location, duration, description});
                }
            }

            if (experiences.length === 0) return '';

            return `
                <div class="cv-section">
                    <h2 class="cv-section-title">Professional Experience</h2>
                    ${experiences.map(exp => `
                        <div class="experience-item">
                            <div class="item-header">
                                <div>
                                    <div class="item-title">${exp.title}</div>
                                    <div class="item-subtitle">${exp.company}${exp.location ? `, ${exp.location}` : ''}</div>
                                </div>
                                ${exp.duration ? `<div class="item-date">${exp.duration}</div>` : ''}
                            </div>
                            ${exp.description ? `<div class="item-description">${exp.description}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function generateEducationSection(data) {
            const education = [];
            for (let i = 1; i <= educationCount; i++) {
                const degree = data[`eduDegree${i}`];
                const institution = data[`eduInstitution${i}`];
                const location = data[`eduLocation${i}`];
                const duration = data[`eduDuration${i}`];
                const description = data[`eduDescription${i}`];
                
                if (degree || institution) {
                    education.push({degree, institution, location, duration, description});
                }
            }

            if (education.length === 0) return '';

            return `
                <div class="cv-section">
                    <h2 class="cv-section-title">Education</h2>
                    ${education.map(edu => `
                        <div class="education-item">
                            <div class="item-header">
                                <div>
                                    <div class="item-title">${edu.degree}</div>
                                    <div class="item-subtitle">${edu.institution}${edu.location ? `, ${edu.location}` : ''}</div>
                                </div>
                                ${edu.duration ? `<div class="item-date">${edu.duration}</div>` : ''}
                            </div>
                            ${edu.description ? `<div class="item-description">${edu.description}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function generateProjectsSection(data) {
            const projects = [];
            for (let i = 1; i <= projectCount; i++) {
                const name = data[`projName${i}`];
                const url = data[`projUrl${i}`];
                const description = data[`projDescription${i}`];
                const tech = data[`projTech${i}`];
                
                if (name) {
                    projects.push({name, url, description, tech});
                }
            }

            if (projects.length === 0) return '';

            return `
                <div class="cv-section">
                    <h2 class="cv-section-title">Projects</h2>
                    ${projects.map(proj => `
                        <div class="project-item">
                            <div class="item-header">
                                <div>
                                    <div class="item-title">${proj.name}</div>
                                    ${proj.url ? `<div class="item-subtitle"><a href="${proj.url}" target="_blank">View Project</a></div>` : ''}
                                </div>
                            </div>
                            ${proj.description ? `<div class="item-description">${proj.description}</div>` : ''}
                            ${proj.tech ? `
                                <div class="tech-stack">
                                    ${proj.tech.split(',').map(tech => `<span class="tech-tag">${tech.trim()}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function generateCertificationsSection(data) {
            const certifications = [];
            for (let i = 1; i <= certificationCount; i++) {
                const name = data[`certName${i}`];
                const issuer = data[`certIssuer${i}`];
                const date = data[`certDate${i}`];
                const url = data[`certUrl${i}`];
                
                if (name || issuer) {
                    certifications.push({name, issuer, date, url});
                }
            }

            if (certifications.length === 0) return '';

            return `
                <div class="cv-section">
                    <h2 class="cv-section-title">Certifications</h2>
                    <div class="certificates-grid">
                        ${certifications.map(cert => `
                            <div class="certificate-card">
                                <div class="certificate-img">
                                    <i class="fas fa-certificate"></i>
                                </div>
                                <div class="certificate-content">
                                    <div class="certificate-title">${cert.name}</div>
                                    <div class="certificate-issuer">${cert.issuer}${cert.date ? ` - ${cert.date}` : ''}</div>
                                    ${cert.url ? `<div style="margin-top: 8px;"><a href="${cert.url}" target="_blank" style="color: #667eea; font-size: 0.8em;">View Credential</a></div>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
